---
- name: Execute Linux patching
  hosts: patch_targets
  become: true
  gather_facts: true

  vars:
    patch_packages: []
    patch_result_file: "/tmp/linux-patching-result-{{ inventory_hostname }}.json"

  tasks:

    - name: Validate package list
      ansible.builtin.assert:
        that:
          - patch_packages | length > 0
        fail_msg: "No packages were provided for patching"

    - name: Refuse unsupported platforms
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts['distribution'] == 'Ubuntu'
            or (ansible_facts['distribution'] == 'RedHat' and ansible_facts['distribution_major_version'] in ['8', '9'])
        fail_msg: >-
          Unsupported platform {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}

    - name: Capture pre-patch kernel
      ansible.builtin.command:
        cmd: uname -r
      register: pre_patch_kernel
      changed_when: false

    - name: Capture pre-patch uptime
      ansible.builtin.command:
        cmd: uptime
      register: pre_patch_uptime
      changed_when: false

    - name: Capture pre-patch failed services
      ansible.builtin.command:
        cmd: systemctl --failed --no-legend
      register: pre_patch_failed_services
      changed_when: false

    # ------------------------------------------------------------ Debian

    - name: Refresh APT metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      when: ansible_facts['os_family'] == 'Debian'

    - name: Upgrade selected packages (apt)
      ansible.builtin.apt:
        name: "{{ patch_packages }}"
        state: latest
      register: patch_result_apt
      when: ansible_facts['os_family'] == 'Debian'

    # ------------------------------------------------------------ RedHat

    - name: Preflight - subscription status (informational)
      ansible.builtin.command:
        cmd: subscription-manager status
      register: rhel_subscription
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Preflight - list enabled repositories
      ansible.builtin.command:
        cmd: dnf --quiet repolist --enabled
      register: rhel_repolist
      changed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Preflight - require at least one enabled repository
      ansible.builtin.assert:
        that:
          # first line of output is the column header
          - rhel_repolist.stdout_lines | length > 1
        fail_msg: >-
          Preflight failed: no enabled dnf repositories.
          subscription-manager: {{ rhel_subscription.stdout | default('n/a') }}
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Preflight - check dnf-utils (needs-restarting) is installed
      ansible.builtin.command:
        cmd: rpm -q --whatprovides /usr/bin/needs-restarting
      register: rhel_dnf_utils
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Preflight - require dnf-utils
      ansible.builtin.assert:
        that:
          - rhel_dnf_utils.rc == 0
        fail_msg: "Preflight failed: dnf-utils is not installed (provides needs-restarting)"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Upgrade selected packages (dnf)
      ansible.builtin.dnf:
        name: "{{ patch_packages }}"
        state: latest
        update_cache: true
      register: patch_result_dnf
      when: ansible_facts['os_family'] == 'RedHat'

    # ------------------------------------------------------ reboot check
    # Report-only: this playbook never reboots a host.

    - name: Check reboot requirement (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_facts['os_family'] == 'Debian'

    # needs-restarting -r: exit 1 = reboot required, 0 = not required
    - name: Check reboot requirement (RedHat)
      ansible.builtin.command:
        cmd: needs-restarting -r
      register: reboot_required_cmd
      changed_when: false
      failed_when: reboot_required_cmd.rc not in [0, 1]
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Record reboot requirement
      ansible.builtin.set_fact:
        reboot_required: >-
          {{ reboot_required_file.stat.exists
             if ansible_facts['os_family'] == 'Debian'
             else (reboot_required_cmd.rc == 1) }}
        patch_changed: >-
          {{ patch_result_apt.changed
             if ansible_facts['os_family'] == 'Debian'
             else patch_result_dnf.changed }}

    - name: Capture post-patch kernel
      ansible.builtin.command:
        cmd: uname -r
      register: post_patch_kernel
      changed_when: false

    - name: Capture post-patch uptime
      ansible.builtin.command:
        cmd: uptime
      register: post_patch_uptime
      changed_when: false

    - name: Capture post-patch failed services
      ansible.builtin.command:
        cmd: systemctl --failed --no-legend
      register: post_patch_failed_services
      changed_when: false

    - name: Write machine-readable result on the server
      ansible.builtin.copy:
        content: "{{ {'reboot_required': reboot_required | bool, 'changed': patch_changed | bool} | to_json }}"
        dest: "{{ patch_result_file }}"
        mode: "0600"
      when: patch_result_output_dir is defined

    - name: Fetch machine-readable result to the master
      ansible.builtin.fetch:
        src: "{{ patch_result_file }}"
        dest: "{{ patch_result_output_dir }}/"
        flat: true
      when: patch_result_output_dir is defined

    - name: Display patch result
      ansible.builtin.debug:
        msg:
          packages: "{{ patch_packages }}"
          changed: "{{ patch_changed }}"
          kernel_before: "{{ pre_patch_kernel.stdout }}"
          kernel_after: "{{ post_patch_kernel.stdout }}"
          reboot_required: "{{ reboot_required }}"
          failed_services_before: "{{ pre_patch_failed_services.stdout_lines }}"
          failed_services_after: "{{ post_patch_failed_services.stdout_lines }}"

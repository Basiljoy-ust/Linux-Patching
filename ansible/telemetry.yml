---
- name: Collect Linux telemetry
  hosts: linux_targets
  become: true
  gather_facts: false

  tasks:

    - name: Create telemetry directory
      ansible.builtin.file:
        path: /opt/linux-patch-agent
        state: directory
        mode: '0755'

    - name: Copy telemetry collector
      ansible.builtin.copy:
        src: ../telemetry/collector.py
        dest: /opt/linux-patch-agent/collector.py
        mode: '0755'

    - name: Copy systemd service inventory helper
      ansible.builtin.copy:
        src: ../telemetry/service_inventory.py
        dest: /opt/linux-patch-agent/service_inventory.py
        mode: '0644'

    - name: Execute telemetry collector
      ansible.builtin.command:
        cmd: python3 /opt/linux-patch-agent/collector.py
      register: telemetry_result
      changed_when: false

    - name: Display telemetry JSON
      ansible.builtin.debug:
        msg: "{{ telemetry_result.stdout }}"

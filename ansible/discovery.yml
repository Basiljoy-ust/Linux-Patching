---
- name: Discover Linux system
  hosts: linux_targets
  become: true
  gather_facts: true

  tasks:

    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Get hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Get kernel version
      ansible.builtin.command: uname -r
      register: kernel_result
      changed_when: false

    - name: Get failed services
      ansible.builtin.command:
        cmd: systemctl --failed --no-legend
      register: failed_services
      changed_when: false

    - name: Get upgradeable packages (Debian family)
      ansible.builtin.shell:
        cmd: apt list --upgradable 2>/dev/null | tail -n +2
      register: upgradeable_packages_apt
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    # dnf check-update exits 100 when updates exist, 0 when none
    - name: Get upgradeable packages (RedHat family)
      ansible.builtin.command:
        cmd: dnf check-update --quiet
      register: upgradeable_packages_dnf
      changed_when: false
      failed_when: upgradeable_packages_dnf.rc not in [0, 100]
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Combine upgradeable package listing
      ansible.builtin.set_fact:
        upgradeable_packages_lines: >-
          {{ (upgradeable_packages_apt.stdout_lines | default([]))
             + (upgradeable_packages_dnf.stdout_lines | default([])) }}

    - name: Display system information
      ansible.builtin.debug:
        msg:
          hostname: "{{ hostname_result.stdout }}"
          kernel: "{{ kernel_result.stdout }}"
          os: "{{ ansible_distribution }}"
          os_version: "{{ ansible_distribution_version }}"
          architecture: "{{ ansible_architecture }}"
          cpu_count: "{{ ansible_processor_vcpus }}"
          memory_mb: "{{ ansible_memtotal_mb }}"
          failed_services: "{{ failed_services.stdout_lines }}"

    - name: Display package count
      ansible.builtin.debug:
        msg: "Installed packages: {{ ansible_facts.packages | length }}"

    - name: Display upgradeable packages
      ansible.builtin.debug:
        var: upgradeable_packages_lines
